<rect class="box blue" x="70" y="542" width="350" height="86" rx="12"/>
<text class="label" x="92" y="578" text-anchor="start">Clouds</text>

<path class="arrow" d="M245 510 L245 542"/>
<text class="lane" x="465" y="154">Debug Views</text>
