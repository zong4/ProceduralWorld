<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Debug and Presentation Support</title>
  <desc id="desc">UI panels expose parameters, visual layers and performance counters.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#315b7c"/>
    </marker>
    <style>
      .bg{fill:#f7fbff}.title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#17324d}.sub{font:18px Inter,Segoe UI,Arial,sans-serif;fill:#5d6b78}
      .lane{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#36566f}.box{fill:#fff;stroke-width:2.2}.blue{stroke:#7daed5;fill:#ffffff}.green{stroke:#76b98d;fill:#f0faf3}.amber{stroke:#dca44a;fill:#fff8e8}.violet{stroke:#a986d7;fill:#f8f2ff}
      .label{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#17324d}.small{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#435464}.arrow{stroke:#315b7c;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="58" y="62">Debug and Presentation Support</text>
  <text class="sub" x="60" y="94" text-anchor="start">UI panels expose parameters, visual layers and performance counters.</text>
  <text class="lane" x="70" y="154">Controls</text>
<rect class="box green" x="70" y="188" width="350" height="86" rx="12"/>
<text class="label" x="92" y="224" text-anchor="start">Terrain</text>

