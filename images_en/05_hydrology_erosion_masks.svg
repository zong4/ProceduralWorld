<path class="arrow" d="M245 274 L245 306"/>
<text class="lane" x="465" y="154">Carving</text>
<rect class="box amber" x="465" y="188" width="350" height="86" rx="12"/>
<text class="label" x="487" y="224" text-anchor="start">Slope</text>

<rect class="box violet" x="465" y="306" width="350" height="86" rx="12"/>
<text class="label" x="487" y="342" text-anchor="start">Stream power</text>

<path class="arrow" d="M640 274 L640 306"/>
<rect class="box blue" x="465" y="424" width="350" height="86" rx="12"/>
