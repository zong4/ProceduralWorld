<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">温湿度、材质与地表分类</title>
  <desc id="desc">把高度、纬度、水体和侵蚀信息转成可渲染的地表材质。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#315b7c"/>
    </marker>
    <style>
      .bg{fill:#f7fbff}.title{font:700 34px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#17324d}.sub{font:18px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#5d6b78}
      .box{fill:#fff;stroke-width:2.2}.blue{stroke:#7daed5;fill:#ffffff}.green{stroke:#76b98d;fill:#f0faf3}.amber{stroke:#dca44a;fill:#fff8e8}.violet{stroke:#a986d7;fill:#f8f2ff}
      .label{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#17324d}.small{font:16px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#435464}.arrow{stroke:#315b7c;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .numCircle{fill:#315b7c}.num{font:700 16px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:white}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="58" y="62">温湿度、材质与地表分类</text>
  <text class="sub" x="60" y="94" text-anchor="start">把高度、纬度、水体和侵蚀信息转成可渲染的地表材质。</text>
  <circle class="numCircle" cx="88" cy="141" r="22"/>
<text class="num" x="88" y="148" text-anchor="middle">01</text>
<rect class="box blue" x="60" y="155" width="255" height="116" rx="12"/>
<text class="label" x="82" y="191" text-anchor="start">根据 sphereDir</text>
<text class="label" x="82" y="215" text-anchor="start">估算纬度</text>

<circle class="numCircle" cx="378" cy="141" r="22"/>
<text class="num" x="378" y="148" text-anchor="middle">02</text>
<rect class="box green" x="350" y="155" width="255" height="116" rx="12"/>
<text class="label" x="372" y="191" text-anchor="start">高度影响温度递减</text>

<path class="arrow" d="M315 213 C332 213, 332 213, 350 213"/>
<circle class="numCircle" cx="668" cy="141" r="22"/>
<text class="num" x="668" y="148" text-anchor="middle">03</text>
<rect class="box amber" x="640" y="155" width="255" height="116" rx="12"/>
<text class="label" x="662" y="191" text-anchor="start">水体、河道和岸线影响湿度</text>

<path class="arrow" d="M605 213 C622 213, 622 213, 640 213"/>
<circle class="numCircle" cx="958" cy="141" r="22"/>
<text class="num" x="958" y="148" text-anchor="middle">04</text>
<rect class="box violet" x="930" y="155" width="255" height="116" rx="12"/>
<text class="label" x="952" y="191" text-anchor="start">地形坡度影响岩石裸露程度</text>

<path class="arrow" d="M895 213 C912 213, 912 213, 930 213"/>
<circle class="numCircle" cx="958" cy="366" r="22"/>
<text class="num" x="958" y="373" text-anchor="middle">05</text>
<rect class="box blue" x="930" y="380" width="255" height="116" rx="12"/>
<text class="label" x="952" y="416" text-anchor="start">侵蚀和沉积影响颜色变化</text>

<path class="arrow" d="M1185 271 L1185 338 L1185 338 L1185 438"/>
<circle class="numCircle" cx="668" cy="366" r="22"/>
<text class="num" x="668" y="373" text-anchor="middle">06</text>
<rect class="box green" x="640" y="380" width="255" height="116" rx="12"/>
<text class="label" x="662" y="416" text-anchor="start">计算</text>
<text class="label" x="662" y="440" text-anchor="start">materialWeights</text>

<path class="arrow" d="M930 438 C912 438, 912 438, 895 438"/>
<circle class="numCircle" cx="378" cy="366" r="22"/>
<text class="num" x="378" y="373" text-anchor="middle">07</text>
<rect class="box amber" x="350" y="380" width="255" height="116" rx="12"/>
<text class="label" x="372" y="416" text-anchor="start">上传到 GPU</text>
<text class="label" x="372" y="440" text-anchor="start">texture array</text>

<path class="arrow" d="M640 438 C622 438, 622 438, 605 438"/>
<circle class="numCircle" cx="88" cy="366" r="22"/>
<text class="num" x="88" y="373" text-anchor="middle">08</text>
<rect class="box violet" x="60" y="380" width="255" height="116" rx="12"/>
<text class="label" x="82" y="416" text-anchor="start">terrain shader</text>
<text class="label" x="82" y="440" text-anchor="start">混合草地、岩石、雪线和海岸</text>

<path class="arrow" d="M350 438 C332 438, 332 438, 315 438"/>
</svg>