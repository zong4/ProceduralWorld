<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">cube-sphere 映射思路</title>
  <desc id="desc">展示 cube face UV 如何映射为球面方向并产生星球顶点。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2d5a87"/></marker>
    <style>
      .bg{fill:#f8fbff}.title{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#19344f}.sub{font:18px 'Microsoft YaHei',Arial,sans-serif;fill:#5b6e82}
      .face{fill:#eaf4ff;stroke:#5b96c9;stroke-width:2}.sphere{fill:#e9f7ee;stroke:#4c9d67;stroke-width:3}.line{stroke:#2d5a87;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#7aa5c6;stroke-width:1.4}.label{font:700 23px 'Microsoft YaHei',Arial,sans-serif;fill:#17324d}.small{font:16px 'Microsoft YaHei',Arial,sans-serif;fill:#43586b}
      .code{font:17px Consolas,'Microsoft YaHei',monospace;fill:#24415b}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="58" y="64">cube-sphere：六个面映射到球面</text>
  <text class="sub" x="60" y="96">优点：比经纬球更适合分块、LOD 和贴图数组，极点不会严重挤压。</text>

  <g transform="translate(105,165)">
    <rect class="face" x="80" y="80" width="150" height="150"/>
    <rect class="face" x="230" y="80" width="150" height="150"/>
    <rect class="face" x="380" y="80" width="150" height="150"/>
    <rect class="face" x="230" y="-70" width="150" height="150"/>
    <rect class="face" x="230" y="230" width="150" height="150"/>
    <rect class="face" x="530" y="80" width="150" height="150"/>
    <line class="thin" x1="230" y1="80" x2="230" y2="230"/>
    <line class="thin" x1="380" y1="80" x2="380" y2="230"/>
    <text class="label" x="215" y="430">6 个 cube face</text>
    <text class="small" x="188" y="456">每个面保存一张二维高度场</text>
  </g>

  <path class="line" d="M690 305 C748 305 790 305 842 305"/>

  <g transform="translate(915,265)">
    <circle class="sphere" cx="115" cy="115" r="110"/>
    <ellipse cx="115" cy="115" rx="110" ry="36" fill="none" stroke="#78b08d" stroke-width="1.6"/>
    <path d="M115 5 C65 45 65 185 115 225" fill="none" stroke="#78b08d" stroke-width="1.4"/>
    <path d="M115 5 C165 45 165 185 115 225" fill="none" stroke="#78b08d" stroke-width="1.4"/>
    <line x1="115" y1="115" x2="185" y2="58" stroke="#2d5a87" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="label" x="-15" y="275">normalize 后得到 sphereDir</text>
  </g>

  <rect x="110" y="540" width="1060" height="92" rx="14" fill="#ffffff" stroke="#b7c9da" stroke-width="2"/>
  <text class="code" x="145" y="578">cubePoint = faceNormal + uv.x * axisU + uv.y * axisV</text>
  <text class="code" x="145" y="610">sphereDir = normalize(cubePoint),  finalPos = sphereDir * (planetRadius + height * heightScale)</text>
</svg>
