  <rect class="green" x="940" y="160" width="280" height="250" rx="10"/>
  <text class="label" x="972" y="205" text-anchor="start">实时画面</text>
  <text class="small" x="972" y="245" text-anchor="start">terrain + ocean + sky + clouds</text>
  <circle cx="1080" cy="330" r="72" fill="#cfefff" stroke="#58a66f" stroke-width="2"/>
