  <rect class="formula" x="85" y="545" width="1110" height="90" rx="8"/>
  <text class="tiny" x="112" y="582" text-anchor="start">main.cpp 管状态，PlanetProceduralData 生成数据，PlanetRenderer 负责上传和绘制。</text>
