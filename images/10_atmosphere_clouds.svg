<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">大气 LUT 与体积云</title>
  <desc id="desc">展示大气散射 LUT 预计算和体积云 raymarch 的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#5b4c97"/></marker>
    <style>
      .bg{fill:#fbf9ff}.title{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#2e2856}.sub{font:18px 'Microsoft YaHei',Arial,sans-serif;fill:#69607f}
      .box{fill:#fff;stroke:#9b86d6;stroke-width:2.4;rx:16}.lut{fill:#f0edff;stroke:#7e65c8;stroke-width:2.4;rx:16}.cloud{fill:#eef7ff;stroke:#6fa5d1;stroke-width:2.4;rx:16}
      .label{font:700 21px 'Microsoft YaHei',Arial,sans-serif;fill:#2e2856}.small{font:15.5px 'Microsoft YaHei',Arial,sans-serif;fill:#514b68}.arrow{stroke:#5b4c97;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="58" y="64">大气散射 LUT + 程序化体积云</text>
  <text class="sub" x="60" y="96">大气颜色来自 LUT 采样；云层在同一个 atmosphere pass 中做 raymarch。</text>

  <rect class="box" x="70" y="150" width="260" height="125"/>
  <text class="label" x="102" y="192">大气参数</text>
  <text class="small" x="102" y="224">Rayleigh / Mie / density</text>
  <text class="small" x="102" y="248">height / exposure / color</text>

  <rect class="lut" x="420" y="120" width="280" height="185"/>
  <text class="label" x="452" y="162">预计算 LUT</text>
  <text class="small" x="452" y="194">transmittance</text>
  <text class="small" x="452" y="222">irradiance</text>
  <text class="small" x="452" y="250">3D scattering</text>
  <text class="small" x="452" y="278">signature 缓存避免重复计算</text>

  <rect class="box" x="790" y="150" width="330" height="125"/>
  <text class="label" x="822" y="192">drawAtmospherePass()</text>
  <text class="small" x="822" y="224">复制 scene depth</text>
  <text class="small" x="822" y="248">fullscreen triangle</text>

  <rect class="cloud" x="120" y="420" width="330" height="155"/>
  <text class="label" x="152" y="462">云层参数</text>
  <text class="small" x="152" y="494">coverage / sharpness / scale</text>
  <text class="small" x="152" y="522">height / thickness / density</text>
  <text class="small" x="152" y="550">view steps / light steps</text>

  <rect class="cloud" x="555" y="410" width="330" height="175"/>
  <text class="label" x="587" y="452">raymarchCloudVolume()</text>
  <text class="small" x="587" y="484">求视线穿过云壳区间</text>
  <text class="small" x="587" y="512">fBM + Worley 生成密度</text>
  <text class="small" x="587" y="540">沿太阳方向采样自阴影</text>
  <text class="small" x="587" y="568">累积颜色和 alpha</text>

  <rect class="lut" x="975" y="430" width="230" height="125"/>
  <text class="label" x="1007" y="472">最终混合</text>
  <text class="small" x="1007" y="504">大气散射颜色</text>
  <text class="small" x="1007" y="528">+ 云层体积颜色</text>

  <path class="arrow" d="M330 212 H420"/>
  <path class="arrow" d="M700 212 H790"/>
  <path class="arrow" d="M450 498 H555"/>
  <path class="arrow" d="M885 498 H975"/>
  <path class="arrow" d="M955 275 C1000 315 1080 370 1090 430"/>
</svg>
