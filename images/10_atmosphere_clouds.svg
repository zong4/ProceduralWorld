<text class="label" x="882" y="224" text-anchor="start">天空</text>

<rect class="box blue" x="860" y="306" width="350" height="86" rx="12"/>
<text class="label" x="882" y="342" text-anchor="start">地平线雾化</text>

<path class="arrow" d="M1035 274 L1035 306"/>
<rect class="box green" x="860" y="424" width="350" height="86" rx="12"/>
<text class="label" x="882" y="460" text-anchor="start">云层光照</text>

